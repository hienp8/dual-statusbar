plugins { id 'com.android.application' }

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.dualsb.oneui'
    compileSdk 35

    signingConfigs {
        // Khoá cố định nằm trong repo: mọi bản build đều cùng chữ ký nên cài đè được, không cần gỡ app.
        shared {
            storeFile file('dualsb.p12')
            storeType 'pkcs12'
            storePassword 'dualsb123'
            keyAlias 'dualsb'
            keyPassword 'dualsb123'
        }
    }

    defaultConfig {
        applicationId 'com.dualsb.oneui'
        minSdk 34          // One UI 7 = Android 15
        targetSdk 34
        // Tự tăng theo số lần build trên GitHub để luôn cài đè được bản cũ
        versionCode runNumber + 100
        versionName '0.3'
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// File APK xuất ra luôn tên là "Dualline SB.apk"
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = "Dualline SB.apk" }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    // Nếu repo api.xposed.info lỗi: tải XposedBridgeAPI-82.jar vào app/libs và dùng dòng dưới thay cho dòng trên
    // compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')   // tránh trùng class kotlin-stdlib
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
}
