plugins { id 'com.android.application' }
android {
    namespace 'com.dualsb.oneui'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dualsb.oneui'
        minSdk 34          // One UI 7 = Android 15
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    // Nếu repo api.xposed.info lỗi: tải XposedBridgeAPI-82.jar vào app/libs và dùng dòng dưới thay cho dòng trên
    // compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')   // tránh trùng class kotlin-stdlib
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
}
